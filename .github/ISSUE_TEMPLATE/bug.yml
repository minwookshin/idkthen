name: Typing or app issue
description: Report an invented, reproducible example.
body:
  - type: markdown
    attributes:
      value: Please do not share private writing, passwords, full logs or signing credentials. This is a development preview.
  - type: textarea
    attributes:
      label: Environment
      description: App version, macOS, browser or target app, keyboard layout, selected languages and mode.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproducer
      description: Invented input, steps, expected result, actual result, and whether Undo preserved later typing.
    validations:
      required: true
